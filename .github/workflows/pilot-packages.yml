name: Verify and publish platform packages

on:
  push:
    branches: [feature/central-access-leases]
    tags: ['v2.0.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python tests/run_ci.py
      - run: python start.py --check
      - run: python center_setup.py check
      - run: python build_platform_release.py --output dist
      - name: Install transition from actual legacy source with synthetic data
        shell: bash
        run: |
          set -euo pipefail
          python -m zipfile -e dist/dvk-transition-pilot.zip transition-smoke
          python tests/transition_fixture.py --bundle transition-smoke --destination legacy-smoke
          python transition-smoke/transition_setup.py --source legacy-smoke --destination candidate-smoke --sender-stopped
          python tests/transition_fixture.py --bundle transition-smoke --destination bridge-legacy-smoke
          python tests/bridge_smoke.py --source bridge-legacy-smoke --packages dist
      - name: Smoke-test unpacked center with only center dependencies
        shell: bash
        run: |
          python -m zipfile -e dist/dvk-center-pilot.zip center-smoke
          python -m venv center-env
          if [ "$RUNNER_OS" = Windows ]; then
            CENTER_PY=center-env/Scripts/python.exe
          else
            CENTER_PY=center-env/bin/python
          fi
          "$CENTER_PY" -m pip install -r center-smoke/requirements-authority.txt
          "$CENTER_PY" center-smoke/center_setup.py check
          cd center-smoke
          "../$CENTER_PY" -c "import access_server; from sync_protocol import initialize_encryption_key; from authority_store import AuthorityStore; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey; s=AuthorityStore('data/smoke.sqlite'); app=access_server.create_server('123:test',99,Ed25519PrivateKey.generate(),s,X25519PrivateKey.generate()); print('Center-only imports and handlers OK; no polling')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-checks-${{ matrix.os }}
          path: test-results/unittest.txt
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: pilot-packages
          path: dist/*

  publish:
    needs: verify
    if: github.ref == 'refs/heads/feature/central-access-leases' || startsWith(github.ref, 'refs/tags/v2.0.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pilot-packages
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c *.sha256)
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="$(tr -d '\r\n' < version.txt)"
            test "$REF_NAME" = "v$VERSION"
            test -f "RELEASE_NOTES_$VERSION.md"
            # Upload all assets while hidden; expose latest only after the upload succeeds.
            gh release create "$REF_NAME" dist/* --repo "$REPOSITORY" --target "$COMMIT_SHA" --verify-tag --draft --title "Telegram AI Sender $REF_NAME" --notes-file "RELEASE_NOTES_$VERSION.md"
            gh release edit "$REF_NAME" --repo "$REPOSITORY" --draft=false --prerelease=false --latest
          else
            TAG="pilot-center-${COMMIT_SHA:0:12}"
            gh release create "$TAG" dist/* --repo "$REPOSITORY" --target "$COMMIT_SHA" --prerelease --latest=false --title "Center pilot ${COMMIT_SHA:0:12}" --notes-file PROJECT_AUDIT.md
          fi
