name: Build installer and publish release

on:
  push:
    branches:
      - release/2.0.19
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: release/2.0.19

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test release discovery and legacy compatibility
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) {
            throw 'Updater compatibility tests failed'
          }

      - name: Build packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^2\.0\.\d+$') {
            throw "Unexpected version: $version"
          }

          $tag = "v$version"
          $out = Join-Path $env:RUNNER_TEMP "release_$version"
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $installer = Join-Path $out "installer"
          $update = Join-Path $out "update"
          New-Item -ItemType Directory -Path $installer, $update -Force | Out-Null

          # Полный установочный пакет
          $runtime = @(
            '.env.example',
            'ai.py',
            'arbitration_api.py',
            'bot.py',
            'config.py',
            'database.py',
            'launcher.py',
            'main.py',
            'migrate_sync.py',
            'products.json',
            'requirements.txt',
            'telegram_client.py',
            'updater.py'
          )

          foreach ($file in $runtime) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Missing required file: $file"
            }
            Copy-Item $file $installer
          }

          if (!(Test-Path prompts -PathType Container)) {
            throw 'prompts folder missing'
          }

          Copy-Item prompts (Join-Path $installer 'prompts') -Recurse
          Set-Content (Join-Path $installer 'version.txt') $version -Encoding ascii

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          chcp 65001 >nul
          if not exist "main.py" (echo ERROR: main.py missing. Extract the full ZIP first.& pause & exit /b 1)
          if not exist "launcher.py" (echo ERROR: launcher.py missing.& pause & exit /b 1)
          if not exist "requirements.txt" (echo ERROR: requirements.txt missing.& pause & exit /b 1)
          py -3.11 --version >nul 2>&1
          if errorlevel 1 (echo Python 3.11 is required: https://www.python.org/downloads/& pause & exit /b 1)
          echo [1/3] Creating virtual environment...
          if not exist "venv\Scripts\python.exe" py -3.11 -m venv venv
          if errorlevel 1 goto ERROR
          echo [2/3] Installing dependencies...
          "venv\Scripts\python.exe" -m pip install -r requirements.txt
          if errorlevel 1 goto ERROR
          echo [3/3] Preparing configuration...
          if not exist ".env" copy ".env.example" ".env" >nul
          if errorlevel 1 goto ERROR
          if not exist "data" mkdir "data"
          echo.
          echo Installation completed. Edit .env, then run start.bat.
          echo Existing .env and data files were not overwritten.
          pause
          exit /b 0
          :ERROR
          echo Installation failed. Existing configuration was not deleted.
          pause
          exit /b 1
          '@ | Set-Content (Join-Path $installer 'install.bat') -Encoding ascii

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          chcp 65001 >nul
          if not exist "venv\Scripts\python.exe" (echo Run install.bat first.& pause & exit /b 1)
          "venv\Scripts\python.exe" launcher.py
          set "RC=%ERRORLEVEL%"
          if not "%RC%"=="0" pause
          exit /b %RC%
          '@ | Set-Content (Join-Path $installer 'start.bat') -Encoding ascii

          # Пакет обновления: код, продукты и промпты
          $updateFiles = @(
            'ai.py',
            'arbitration_api.py',
            'bot.py',
            'database.py',
            'launcher.py',
            'main.py',
            'products.json',
            'updater.py'
          )

          foreach ($file in $updateFiles) {
            if (!(Test-Path $file -PathType Leaf)) {
              throw "Missing update file: $file"
            }
            Copy-Item $file $update
          }

          Copy-Item prompts (Join-Path $update 'prompts') -Recurse
          # Keep Nikolai.md out of update ZIPs: older launchers reject files outside their allowlist.
          Remove-Item (Join-Path $update 'prompts/Nikolai.md') -Force -ErrorAction SilentlyContinue
          Set-Content (Join-Path $update 'version.txt') $version -Encoding ascii

          # Проверка синтаксиса Python
          $installerPython = @(
            Get-ChildItem $installer -Filter '*.py' -File |
              ForEach-Object { $_.FullName }
          )

          python -m py_compile $installerPython
          if ($LASTEXITCODE -ne 0) {
            throw 'Installer Python syntax check failed'
          }

          $updatePython = @(
            Get-ChildItem $update -Filter '*.py' -File |
              ForEach-Object { $_.FullName }
          )

          python -m py_compile $updatePython
          if ($LASTEXITCODE -ne 0) {
            throw 'Update Python syntax check failed'
          }

          Get-ChildItem -Path $installer, $update -Directory -Filter '__pycache__' |
            Remove-Item -Recurse -Force

          # Создание ZIP-архивов
          $updateZip = Join-Path $out "telegram_ai_sender_$tag.zip"
          $installerZip = Join-Path $out "telegram_ai_sender_installer_$version.zip"

          Compress-Archive -Path (Join-Path $update '*') `
            -DestinationPath $updateZip -CompressionLevel Optimal

          Compress-Archive -Path (Join-Path $installer '*') `
            -DestinationPath $installerZip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Проверка полного состава архива обновления
          $expectedUpdateNames = @(
            'ai.py',
            'arbitration_api.py',
            'bot.py',
            'database.py',
            'launcher.py',
            'main.py',
            'products.json',
            'prompts/bg.md',
            'prompts/credit.md',
            'prompts/pravo_ip.md',
            'prompts/pravo_ooo.md',
            'prompts/zakupki_konsalt.md',
            'updater.py',
            'version.txt'
          ) | Sort-Object

          $z = [System.IO.Compression.ZipFile]::OpenRead($updateZip)
          try {
            $actualUpdateNames = @(
              $z.Entries |
                Where-Object { -not $_.FullName.EndsWith('/') } |
                ForEach-Object { $_.FullName } |
                Sort-Object
            )

            $difference = Compare-Object $expectedUpdateNames $actualUpdateNames
            if ($difference) {
              throw "Unexpected update ZIP contents: $($actualUpdateNames -join ', ')"
            }
          }
          finally {
            $z.Dispose()
          }

          # Проверка установочного архива
          $z = [System.IO.Compression.ZipFile]::OpenRead($installerZip)
          try {
            $installerNames = @(
              $z.Entries |
                Where-Object { -not $_.FullName.EndsWith('/') } |
                ForEach-Object { $_.FullName }
            )

            foreach ($required in @(
              'ai.py',
              'arbitration_api.py',
              'launcher.py',
              'install.bat',
              'start.bat',
              'main.py',
              'products.json',
              'version.txt',
              'prompts/bg.md',
              'prompts/credit.md',
              'prompts/pravo_ip.md',
              'prompts/pravo_ooo.md',
              'prompts/zakupki_konsalt.md',
              'prompts/Nikolai.md'
            )) {
              if ($installerNames -notcontains $required) {
                throw "Installer missing: $required"
              }
            }

            foreach ($forbidden in @(
              '.env',
              'telegram_sender.session',
              'data/local.sqlite'
            )) {
              if ($installerNames -contains $forbidden) {
                throw "Personal file included: $forbidden"
              }
            }
          }
          finally {
            $z.Dispose()
          }

          # Контрольные суммы SHA-256
          foreach ($zip in @($updateZip, $installerZip)) {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content "$zip.sha256" "$hash  $(Split-Path $zip -Leaf)" -Encoding ascii
          }

          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "UPDATE_ZIP=$updateZip" >> $env:GITHUB_ENV
          "INSTALLER_ZIP=$installerZip" >> $env:GITHUB_ENV
          "UPDATE_SHA=$updateZip.sha256" >> $env:GITHUB_ENV
          "INSTALLER_SHA=$installerZip.sha256" >> $env:GITHUB_ENV

          Write-Host "Built and verified release $tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Telegram AI Sender ${{ env.RELEASE_TAG }}
          target_commitish: release/2.0.19
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.UPDATE_ZIP }}
            ${{ env.UPDATE_SHA }}
            ${{ env.INSTALLER_ZIP }}
            ${{ env.INSTALLER_SHA }}