name: Python checks

on:
  pull_request:
    branches:
      - main
      - feature/auto-updates
  push:
    branches:
      - feature/manager-access-approval
      - feature/auto-updates

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q bot.py config.py ai.py database.py telegram_client.py tests
      - name: Run access-control tests
        run: python -m unittest discover -s tests -v
