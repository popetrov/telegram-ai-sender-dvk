name: Python checks

on:
  pull_request:
    branches:
      - main
      - feature/auto-updates
  push:
    branches:
      - feature/manager-access-approval

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python files
        run: python -m compileall -q .
